[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --html=reports/report.html 
    --self-contained-html
    --json-report 
    --json-report-file=reports/report.json
markers =
    negative: Атаки, которые должны быть заблокированы
    positive: Легитимные запросы, которые должны работать
    slow: Медленные тесты (требуют LLM)