services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-secure
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  agent:
    build: .
    container_name: llm-agent-secure
    ports:
      - "8001:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama-secure:11434
    volumes:
      - ./app/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data: